name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Toolchain, components and targets come from rust-toolchain.toml (single source).
      - run: rustup toolchain install --no-self-update
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: CHECK_LOCKED=1 scripts/check.sh
