[workspace]
members = [
	"crates/viewer_core",
	"crates/viewer_render_wgpu",
	"crates/viewer_wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.29"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
	"HtmlCanvasElement",
	"console",
] }
wgpu = "24"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
