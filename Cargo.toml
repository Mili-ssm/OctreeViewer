[workspace]
members = [
	"crates/viewer_core",
	"crates/viewer_format",
	"crates/viewer_convert",
	"crates/viewer_render_wgpu",
	"crates/viewer_wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
ctrlc = "3.5"
glam = "0.29"
las = { version = "0.11.1", default-features = false, features = ["laz"] }
rayon = "1.12"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
	"Blob",
	"DedicatedWorkerGlobalScope",
	"FileReaderSync",
	"HtmlCanvasElement",
	"OffscreenCanvas",
	"Performance",
	"console",
] }
wgpu = "24"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

# Lower compile overhead for frequent local test runs. Use `cargo test --workspace`
# as the unoptimized compiler-default baseline when comparing timings.
[profile.fast]
inherits = "dev"
debug = 0
incremental = true

# Optimized native benchmark iteration without the full release LTO cost.
# Record this profile explicitly; results are not interchangeable with `release`.
[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
