[workspace]
members = [
	"crates/viewer_core",
	"crates/viewer_format",
	"crates/viewer_convert",
	"crates/viewer_convert_core",
	"crates/viewer_render_wgpu",
	"crates/viewer_wasm",
	"tools/convert_parity",
	"tools/format_parity",
	"tools/laz_chunk_probe",
]
resolver = "2"
exclude = ["vendor/lz4_flex"]

# Opted in per crate with `[lints] workspace = true`. viewer_render_wgpu and viewer_wasm join
# after the phase-2b branch merges (it edits them); see CONTRIBUTING, "Clippy".
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints.
# Numeric/graphics code: casts are deliberate and reviewed.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Exact float equality is intended (e.g. bit-identical GPU/CPU twins in tests).
float_cmp = "allow"
# Mathematical notation uses short, similar names.
similar_names = "allow"
many_single_char_names = "allow"
# `assert!(x.is_empty(), "{x:?}")` reads better than comparing with an empty array.
assert_is_empty = "allow"
# Noise.
must_use_candidate = "allow"
module_name_repetitions = "allow"
# Revisit with the public API project.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Many long functions: a separate refactoring; revisit.
too_many_lines = "allow"
# Restriction lints, cherry-picked (never the group).
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
# Configured by each crate's clippy.toml.
disallowed_methods = "deny"
disallowed_types = "deny"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
ctrlc = "3.5"
glam = "0.34"
las = { version = "0.11.1", default-features = false, features = ["laz"] }
rayon = "1.12"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
	"Blob",
	"DedicatedWorkerGlobalScope",
	"FileReaderSync",
	"HtmlCanvasElement",
	"OffscreenCanvas",
	"Performance",
	"console",
] }
wgpu = "30"

[patch.crates-io]
lz4_flex = { path = "vendor/lz4_flex" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Lower compile overhead for frequent local test runs. Use `cargo test --workspace`
# as the unoptimized compiler-default baseline when comparing timings.
[profile.fast]
inherits = "dev"
debug = 0
incremental = true

# Optimized native benchmark iteration without the full release LTO cost.
# Record this profile explicitly; results are not interchangeable with `release`.
[profile.perf]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
