[package]
name = "viewer_core"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[features]
experimental = []
# Decoded LAZ chunk-table check (`las::check_laz_chunk_table`); sequential `laz` only.
laz = ["dep:laz"]

[dependencies]
glam.workspace = true
# Same version as the lock via `las`; no `parallel`, so it builds for wasm32.
laz = { version = "0.13", optional = true }
serde.workspace = true
thiserror.workspace = true

[[test]]
name = "node_attributes"
required-features = ["experimental"]

[[test]]
name = "occupied_point_block"
required-features = ["experimental"]

[lints]
workspace = true
