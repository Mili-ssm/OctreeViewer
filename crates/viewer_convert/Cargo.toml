[package]
name = "viewer_convert"
version.workspace = true
edition.workspace = true
readme = "README.md"

[[bin]]
name = "viewer_convert"
path = "src/main.rs"

[dependencies]
ctrlc.workspace = true
las = { workspace = true, features = ["laz-parallel"] }
# Same version as the lock via `las`; used only to decode the chunk table before `las` does.
laz = "0.13"
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
viewer_core = { path = "../viewer_core", features = ["laz"] }
viewer_format = { path = "../viewer_format" }

[dev-dependencies]
tempfile = "3"
