[package]
name = "viewer_convert"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[[bin]]
name = "viewer_convert"
path = "src/main.rs"

[dependencies]
ctrlc.workspace = true
las = { workspace = true, features = ["laz-parallel"] }
rayon.workspace = true
serde.workspace = true
thiserror.workspace = true
viewer_core = { path = "../viewer_core" }
viewer_convert_core = { path = "../viewer_convert_core" }
viewer_format = { path = "../viewer_format" }

[dev-dependencies]
# Same version as the lock via `las`; the preflight tests build LAZ chunk tables with it.
laz = "0.13"
serde_json.workspace = true
tempfile = "3"
viewer_render_wgpu = { path = "../viewer_render_wgpu" }

[lints]
workspace = true
