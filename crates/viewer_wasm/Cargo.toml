[package]
name = "viewer_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
test-reference-spacing = []

[dependencies]
serde.workspace = true
thiserror.workspace = true
viewer_core = { path = "../viewer_core" }
viewer_render_wgpu = { path = "../viewer_render_wgpu" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
las.workspace = true
viewer_convert_core = { path = "../viewer_convert_core" }
viewer_format = { path = "../viewer_format" }
bytemuck.workspace = true
js-sys.workspace = true
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["FileSystemReadWriteOptions", "FileSystemSyncAccessHandle"] }
wgpu.workspace = true

[dev-dependencies]
viewer_format = { path = "../viewer_format" }

[lints]
workspace = true
