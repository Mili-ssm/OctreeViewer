[package]
name = "viewer_format"
version.workspace = true
edition.workspace = true
readme = "README.md"

[features]
async-reader = ["dep:tokio"]
experimental = ["viewer_core/experimental"]

[dependencies]
lz4_flex = "0.14"
thiserror.workspace = true
viewer_core = { path = "../viewer_core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.3", optional = true, features = ["rt", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }

[[test]]
name = "experimental_tuple_dictionary"
required-features = ["experimental"]

[[example]]
name = "node_attribute_bench"
required-features = ["experimental"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
disallowed_methods = "deny"
