[package]
name = "viewer_format"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"

[features]
async-reader = ["dep:tokio"]
experimental = ["viewer_core/experimental"]

[dependencies]
lz4_flex = "0.14"
thiserror.workspace = true
# C zstd, level 3, magicless frames: the same bytes on native and wasm32 (v8.2-pre).
zstd = { version = "0.13.5", default-features = false, features = ["experimental"] }
viewer_core = { path = "../viewer_core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.3", optional = true, features = ["rt", "sync"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "sync", "time"] }

[[test]]
name = "experimental_tuple_dictionary"
required-features = ["experimental"]

[[example]]
name = "node_attribute_bench"
required-features = ["experimental"]

[lints]
workspace = true
