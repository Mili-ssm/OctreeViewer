# Conversion output must be identical on every target: libm functions differ between glibc and the
# wasm32 libm (see docs/adr/0016). `powi` is allowed: it lowers to compiler-rt multiplications.
disallowed-methods = [
  { path = "f64::hypot", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::powf", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::exp", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::exp2", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::ln", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::log", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::log2", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::log10", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::cbrt", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::sin", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::cos", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::tan", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::atan2", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f64::mul_add", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f32::hypot", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
  { path = "f32::powf", reason = "libm-backed: result differs between targets; conversion output must use only + - * / and sqrt" },
