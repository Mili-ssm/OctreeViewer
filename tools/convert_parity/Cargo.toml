[package]
name = "convert_parity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
viewer_convert_core = { path = "../../crates/viewer_convert_core" }

# Only the native reference needs the CLI path; the wasm32 lib must not pull it in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
viewer_convert = { path = "../../crates/viewer_convert" }
