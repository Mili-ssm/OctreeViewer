[package]
name = "format_parity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
viewer_core = { path = "../../crates/viewer_core" }
viewer_format = { path = "../../crates/viewer_format" }

# Only the block dumper needs the converter; the wasm32 lib must not pull it in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
viewer_convert = { path = "../../crates/viewer_convert" }

[lints]
workspace = true
